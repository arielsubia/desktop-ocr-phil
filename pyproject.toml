[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phildev-desktop-ocr"
version = "0.1.0"
description = "Desktop screen-capture OCR app (Tesseract offline / AWS cloud) for Windows"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Phil Dev" }]
license = { text = "Proprietary" }

[project.urls]
Homepage = "https://github.com/arielsubia/desktop-ocr-phil"

[project.scripts]
phildev-ocr = "phildev_ocr.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
